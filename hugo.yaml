    Content: >-
      B.Sc. Informatik-Student an der TU Dortmund | Ich möchte meine Kenntnisse in DevOps und cloudnativen Lösungen
      weiter ausbauen, praktische Erfahrung sammeln und von erfahrenen Engineers und Entwicklern lernen.


      **Diese Webseite dient als Live-Demonstration für [IaC](https://github.com/minhkhuong0/static-site-infra)
      & [CI/CD Pipeline](https://github.com/minhkhuong0/portfolio/actions)** -
      Die AWS-EC2-Instanz und Cloudflare-Einträge werden mit OpenTofu bereitgestellt und der NGINX-Docker-Container mit Ansible.
      Der Inhalt sowie der Lebenslauf werden per Github Actions automatisch gebaut und deployed.


